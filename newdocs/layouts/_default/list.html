{{ define "main" }}
  <article class="wiki-article">
    <header class="article-header">
      <div class="eyebrow">Index</div>
      <h1>{{ .Title }}</h1>
    </header>
    <div class="article-body">{{ .Content }}</div>
    <div class="index-list">
      {{ range .Pages.ByTitle }}
        <a class="index-card" href="{{ .RelPermalink }}">
          <strong>{{ .LinkTitle }}</strong>
          {{ with .Description }}<span>{{ . }}</span>{{ end }}
        </a>
      {{ end }}
    </div>
  </article>
{{ end }}
